name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Honey Book Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.VITE_GOOGLE_BOOKS_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Initialize Capacitor Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Generate native Android app icons and splash screens
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon-only.png
          cp public/icon-512.png assets/icon-foreground.png
          cp public/icon-512.png assets/icon-background.png
          cp public/icon-512.png assets/splash.png
          cp public/icon-512.png assets/splash-dark.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f0f14' --iconBackgroundColorDark '#0f0f14' --splashBackgroundColor '#0f0f14' --splashBackgroundColorDark '#0f0f14'

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: honey-book-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
